<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SMARTY CWV Dashboard</title>
<style>
  :root { --charcoal: #2d2f32; --text: #424449; --muted: #64666b; --mint: #8ed6c9; --mint-strong: #1f7a6d;
          --bg: #f3faf9; --line: #d9d9d9; --coral-tint: #ffe9df; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg);
         font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--text); }
  .box { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e7ecec; border-radius: 12px; padding: 28px 28px 24px;
         box-shadow: 0 1px 2px rgba(45,47,50,.06); }
  .mark { font-weight: 700; letter-spacing: .08em; font-size: 13px; color: var(--mint-strong); }
  h1 { font-size: 20px; margin: 6px 0 4px; color: var(--charcoal); font-weight: 600; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  input[type=password] { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; }
  .chk { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; font-weight: 400; color: var(--text); cursor: pointer; }
  .chk input { width: 16px; height: 16px; accent-color: var(--mint-strong); }
  button { width: 100%; padding: 11px; font: inherit; font-weight: 600; border: 0; border-radius: 8px; background: var(--charcoal);
           color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  :focus-visible { outline: 2px solid var(--mint-strong); outline-offset: 2px; }
  #msg { margin: 14px 0 0; min-height: 1.2em; font-size: 13px; color: var(--charcoal); }
  #msg.err { background: var(--coral-tint); padding: 8px 10px; border-radius: 6px; }
</style>
</head>

<script>
(function () {
  "use strict";
  var P = JSON.parse(document.getElementById("payload").textContent);
  var KEY = "smarty-cwv-pw";
  var form = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
  function b64(s) { var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  function say(text, err) { msg.textContent = text; msg.className = err ? "err" : ""; }
  function store(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }

  async function unlock(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
    var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }
  function show(html) { document.open(); document.write(html); document.close(); }

  async function attempt(pw, remember) {
    go.disabled = true; say("Opening…");
    try {
      var html = await unlock(pw);
      if (remember) store(function (s) { s.setItem(KEY, pw); });
      show(html);
    } catch (e) {
      go.disabled = false;
      say(window.crypto && crypto.subtle && window.DecompressionStream
        ? "That password did not work. Check it and try again."
        : "This browser is too old to open the dashboard. Please use a current version of Chrome, Edge or Safari.", true);
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    attempt(document.getElementById("pw").value, document.getElementById("rem").checked);
  });

  var saved = store(function (s) { return s.getItem(KEY); });
  if (saved) {
    unlock(saved).then(show, function () {
      store(function (s) { s.removeItem(KEY); });
      say("The saved password no longer works (it may have been changed). Please enter the new one.", true);
    });
  }
})();
</script>
